spring:
  application:
    name: demo

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8085,http://127.0.0.1:8085}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:admin}
    secret-key: ${S3_SECRET_KEY:admin123}
    path-style-access: ${S3_PATH_STYLE:true}
    presign-expiry: ${S3_PRESIGN_EXPIRY:15m}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/pub}
    private-bucket: ${S3_BUCKET_PRIV:priv}
    public-bucket: ${S3_BUCKET_PUB:pub}
    temp-prefix: ${S3_TEMP_PREFIX:tmp/}
    temp-ttl: ${S3_TEMP_TTL:15m}
    temp-cleanup-interval: ${S3_TEMP_CLEANUP_INTERVAL:1m}
    temp-cleanup-grace: ${S3_TEMP_CLEANUP_GRACE:30s}
    temp-cleanup-enabled: ${S3_TEMP_CLEANUP_ENABLED:true}
