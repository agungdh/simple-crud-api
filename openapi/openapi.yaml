openapi: 3.0.3
info:
  title: Demo API
  version: 1.0.0
  description: |
    API untuk manajemen user dan upload file sementara (temporary upload).

    User:
    - Cursor pagination berbasis `uuid` dengan parameter `?after={uuid}`.
    - Semua identifier yang diekspos adalah `uuid`; `id` bigint internal tidak
      pernah keluar di API.
    - Soft delete: data yang dihapus tidak tampil pada query manapun.

    Upload:
    1. `POST /api/uploads/presign` dengan `size` file untuk mendapatkan `key`
       dan `uploadUrl`.
    2. Upload file langsung ke object storage dengan `PUT {uploadUrl}`.
       `Content-Length` harus sama dengan `size` yang dikirim saat presign.
    3. File tersimpan di `tmp/{uuid}` dan otomatis dihapus setelah 15 menit
       jika tidak diproses lebih lanjut.

    Presigned URL berlaku 15 menit.
  contact:
    name: Demo
servers:
  - url: http://localhost:8080
    description: Local development
security: []
tags:
  - name: Users
    description: Manajemen user dengan cursor pagination dan soft delete
  - name: Uploads
    description: Presigned temporary upload
paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Daftar user dengan cursor pagination
      operationId: listUsers
      parameters:
        - name: search
          in: query
          required: false
          description: Pencarian case-insensitive pada username dan name.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: UUID user terakhir dari halaman sebelumnya.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Jumlah data per halaman (default 20, maksimum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Daftar user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCursorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Users
      summary: Membuat user baru
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: UUID public user.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Users
      summary: Detail user berdasarkan uuid
      operationId: getUser
      responses:
        '200':
          description: Detail user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Users
      summary: Update user berdasarkan uuid
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User berhasil diupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Users
      summary: Soft delete user berdasarkan uuid
      operationId: deleteUser
      responses:
        '204':
          description: User berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFound'
  /api/uploads/presign:
    post:
      tags:
        - Uploads
      summary: Membuat presigned URL untuk upload file sementara
      description: |
        Membuat object key sementara (`tmp/{uuid}`) dan presigned PUT URL ke
        bucket private. Ukuran file di-sign sebagai `Content-Length`, sehingga
        upload dengan ukuran berbeda akan ditolak oleh object storage.
      operationId: presignUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
            examples:
              image:
                summary: Upload gambar 200 KiB
                value:
                  size: 204800
      responses:
        '200':
          description: Presigned URL berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
              examples:
                success:
                  value:
                    key: tmp/d7b9c95a-4e59-43eb-8dfb-04aa42ecaaba
                    uploadUrl: 'http://localhost:9000/priv/tmp/d7b9c95a-4e59-43eb-8dfb-04aa42ecaaba?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20261119T191549Z&X-Amz-SignedHeaders=content-length%3Bhost&X-Amz-Credential=admin%2F20261119%2Fus-east-1%2Fs3%2Faws4_request&X-Amz-Expires=900&X-Amz-Signature=843a6cee46814e7af2eead4af82da6f265347c7ba860904b60fae5b81e663337'
                    expiresIn: 900
        '400':
          description: Ukuran file tidak ada atau tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    timestamp: '2026-11-19T19:18:27.116Z'
                    status: 400
                    error: Bad Request
                    path: /api/uploads/presign
        '413':
          description: |
            Ukuran file melebihi batas maksimum. Batas diatur lewat
            `S3_TEMP_MAX_SIZE` (default `100MB`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooLarge:
                  value:
                    timestamp: '2026-11-20T05:00:00.000Z'
                    status: 413
                    error: Content Too Large
                    path: /api/uploads/presign
components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - name
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 255
        name:
          type: string
          maxLength: 255
    UpdateUserRequest:
      type: object
      required:
        - username
        - name
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 255
          description: Opsional. Jika kosong atau tidak dikirim, password tidak diubah.
        name:
          type: string
          maxLength: 255
    UserResponse:
      type: object
      required:
        - uuid
        - username
        - name
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    UserCursorResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required:
        - limit
        - hasNext
      properties:
        limit:
          type: integer
        hasNext:
          type: boolean
        nextCursor:
          type: string
          format: uuid
          nullable: true
    PresignUploadRequest:
      type: object
      required:
        - size
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          description: |
            Ukuran file dalam byte. Nilai ini di-sign sebagai `Content-Length`,
            jadi upload harus tepat sebesar ini. Maksimum mengikuti
            `S3_TEMP_MAX_SIZE` (default `100MB`).
          example: 204800
    PresignUploadResponse:
      type: object
      required:
        - key
        - uploadUrl
        - expiresIn
      properties:
        key:
          type: string
          description: Key object sementara di bucket private.
          example: tmp/d7b9c95a-4e59-43eb-8dfb-04aa42ecaaba
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL untuk upload file.
        expiresIn:
          type: integer
          format: int64
          description: Masa berlaku presigned URL dalam detik.
          example: 900
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        path:
          type: string
  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Konflik data, misalnya username sudah digunakan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
